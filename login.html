<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circuify</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="login.css">   
</head>
<body>
    <header>
        <a href="index.html" class="logo" style="text-decoration: none; color: inherit;">
            <span class="icon">✨</span> Circuify
        </a>
        <div class="nav-buttons">
            <a href="login.html" style="text-decoration: none;"><button class="btn-secondary">Apparate In</button></a>
            <a href="signup.html" style="text-decoration: none;"><button class="btn-primary">Enroll Now</button></a>
        </div>
    </header>

    <main>
        <section class="auth-section">
            <div class="card auth-card">
                <a href="index.html" class="back-link">&larr; Back to Diagon Alley</a>
                
                <h2>Access Your Vault</h2>
                <p style="text-align: center; color: #9CA3AF; margin-bottom: 1rem;">Log in to trade your waste materials!</p>
                <form id="login-form">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required placeholder="e.g. harry.potter@hogwarts.ac.uk">
                    </div>
                    <div class="form-group" style="margin-top: 1rem;">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required placeholder="Your magical key">
                    </div>
                    <div class="auth-options" style="margin-top: 1rem;">
                        <label><input type="checkbox"> Remember me</label>
                        <a href="#">Forgot password?</a>
                    </div>
                    <button type="submit" class="btn-primary" style="width: 100%; margin-top: 1.5rem; padding: 0.75rem;">Apparate In</button>
                </form>
                <div class="auth-footer">
                    <p>New to The Sorting Scrap? <a href="signup.html">Enroll as a Wizard</a></p>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>Made with magic by Team Circuify for Hackathon 2024 - Mischief Managed!</p>
    </footer>
<script>
    document.getElementById('login-form').addEventListener('submit', function(e) {
        e.preventDefault();
        console.log('Logging in...');
        // Send user to the role selection page after login
        window.location.href = 'role.html'; 
    });
</script>
</body>
</html>
