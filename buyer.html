<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagon Alley | Circuify</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="buyer.css">
</head>
<body>
    <header>
        <div class="logo">
            <span class="icon">✨</span> Circuify
        </div>
        <div class="nav-buttons">
            <span class="portal-label">Ministry Buyer Portal</span>
            <button class="btn-secondary" onclick="window.location.href='role.html'">Use Floo Network (Switch Role)</button>
        </div>
    </header>

    <main class="dashboard">
        <aside class="sidebar">
            <h3>Sorting Hat Filters</h3>
            <div class="filter-group">
                <label>Waste Category</label>
                <select>
                    <option>All Categories</option>
                    <option>Dragon Scale Metals</option>
                    <option>Potion Residues</option>
                    <option>Herbology Scraps</option>
                    <option>Wizard Robes</option>
                    <option>Parchment & Scrolls</option>
                    <option>Muggle Artifacts</option>
                    <option>Castle Stones</option>
                    <option>Phoenix Ashes</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Quantity Minimum (Cauldrons)</label>
                <input type="number" placeholder="e.g. 50">
            </div>
            <div class="filter-group">
                <label>Broomstick Distance</label>
                <select>
                    <option>Within Hogsmeade</option>
                    <option>Within 100 Leagues</option>
                    <option>Global</option>
                </select>
            </div>
            <button class="btn-primary" style="width: 100%; margin-top: 1rem;">Cast Filter Charm</button>
        </aside>

        <section class="marketplace-section">
            <h2>Available Scrap Treasures</h2>
            <div class="marketplace-grid">
                
                <div class="listing-card">
                    <span class="listing-tag">Dragon Scale Metals</span>
                    <h3>Slightly Charred Ironbelly Scales</h3>
                    <p class="listing-desc">Consistent monthly output from the Gringotts security division.</p>
